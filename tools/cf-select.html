<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Select Content Fragment</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #cf { height: 100vh; }
      .cf-msg { padding: 24px; color: #333; }
    </style>
    <!-- AEM Content Fragment Selector MFE (UMD) exposes window.PureJSContentFragmentSelectors -->
    <script src="https://experience.adobe.com/solutions/CQ-sites-content-fragment-selector/static-assets/resources/content-fragment-selector.js"></script>
  </head>
  <body>
    <div id="cf"><p class="cf-msg">Loading Content Fragment Selector…</p></div>
    <script type="module">
      import DA_SDK from 'https://da.live/nx/utils/sdk.js';

      // DA authoring instance for this project.
      const REPO_ID = 'author-p116706-e1142141.adobeaemcloud.com';
      const ORG_ID = '716E61785DF4006C0A495ED2@AdobeOrg';
      // Block inserted on selection. Switch to 'insight-article-metadata' if the
      // body is authored in the page rather than driven from the fragment.
      const BLOCK_NAME = 'insight-article';

      const container = document.getElementById('cf');
      const fail = (msg) => { container.innerHTML = `<p class="cf-msg">${msg}</p>`; };

      const selectors = window.PureJSContentFragmentSelectors;
      if (!selectors) {
        fail('Content Fragment Selector failed to load. Check network access to experience.adobe.com.');
      } else {
        // Reuse the IMS token from the DA host (da.live is already signed in and
        // allow-listed for IMS). Running the selector's own auth flow here would
        // hit IMS from the aem.page origin, which is not allow-listed → CORS.
        // The plugin only works when launched from the DA Library (needs the
        // host token); guard against being opened directly.
        const timeout = new Promise((_, rej) => { setTimeout(() => rej(new Error('timeout')), 6000); });
        let sdk;
        try {
          sdk = await Promise.race([DA_SDK, timeout]);
        } catch {
          sdk = null;
          fail('Open this from the Library panel inside the DA editor.');
        }

        if (sdk && sdk.token) {
          selectors.renderContentFragmentSelector(container, {
            imsToken: sdk.token,
            orgId: ORG_ID,
            repoId: REPO_ID,
            env: 'PROD',
            // Keep the dialog wrapper (do NOT set noWrap) so the Select / Cancel
            // action buttons are shown — noWrap renders only the inventory table.
            isOpen: true,
            selectionType: 'single',
            dialogSize: 'fullscreen',
            onDismiss: () => sdk.actions.closeLibrary(),
            onSubmit: ({ contentFragments }) => {
              const path = contentFragments && contentFragments[0] && contentFragments[0].path;
              if (!path) return;
              // A DA block is a table whose first row is the block name; the
              // second cell shows the selected Content Fragment path.
              sdk.actions.sendHTML(
                `<table><tr><td>${BLOCK_NAME}</td></tr><tr><td>${path}</td></tr></table>`,
              );
              sdk.actions.closeLibrary();
            },
          });
        } else if (sdk) {
          fail('No IMS token available from the DA host. Sign in to DA and reopen.');
        }
      }
    </script>
  </body>
</html>
